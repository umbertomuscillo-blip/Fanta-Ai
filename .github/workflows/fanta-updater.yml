name: Fanta AI Daily Updater

on:
  schedule:
    # Esegue ogni giorno alle 12:00 UTC (14:00 in Italia)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permette l'avvio manuale dal sito

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas
          
      - name: Run Fanta Updater Script
        run: python update_fanta_data.py
        
      - name: Commit and Push new data
        run: |
          git config --global user.name 'Fanta AI Bot'
          git config --global user.email 'bot@fanta-ai.com'
          git add data/*.json data/*.csv sync_report.json
          # Fa il commit solo se ci sono effettivamente cambiamenti
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Aggiornamento automatico dati Fantacalcio" && git push)
